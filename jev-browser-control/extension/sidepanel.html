<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jev Browser Control</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon48.png" alt=""> Jev</div>
    <div class="row pills">
      <span class="pill" id="claude" title="Claude conecta pelo servidor MCP deste computador"><span class="dot"></span><span>Claude</span></span>
      <span class="pill" id="provider"><span class="dot"></span><span>…</span></span>
      <span class="pill" id="remote" hidden title="Apps de IA remotos controlam este navegador pelo relay"><span class="dot"></span><span>Remote</span></span>
    </div>
  </header>

  <div class="modebar">
    <label for="mode">Modo</label>
    <select id="mode">
      <option value="navegador">🌐 Navegador</option>
      <option value="computador">🖥️ Computador (requer app nativo)</option>
    </select>
  </div>

  <main>
    <section id="confirm" class="card confirm" hidden role="alertdialog" aria-labelledby="confirm-title">
      <h3 id="confirm-title">Permitir este clique?</h3>
      <p id="confirm-text"></p>
      <div class="row">
        <button class="btn primary grow" id="allow">Permitir uma vez</button>
        <button class="btn" id="deny">Parar</button>
      </div>
    </section>

    <div id="chat" aria-live="polite"></div>

    <section aria-live="polite">
      <ol id="log" class="log"></ol>
    </section>
  </main>

  <footer class="bottom">
    <a href="options.html" target="_blank">Settings</a>
    <span>·</span>
    <a href="https://jevbrowsercontrol.com/docs" target="_blank" rel="noopener">Docs</a>
    <span class="grow"></span>
    <span id="cost" class="mono"></span>
  </footer>

  <form id="chat-form" class="chatbar">
    <textarea id="msg" rows="2" placeholder="Fale com o Jev… (Ctrl+Enter envia)"></textarea>
    <button class="btn primary" id="send" type="submit" title="Enviar">➤</button>
    <button class="btn danger" id="chat-stop" type="button" hidden title="Interromper">■</button>
  </form>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
